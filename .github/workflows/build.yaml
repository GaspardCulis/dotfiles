name: "Build"

on:
  push:
    branches:
      - main

jobs:
  # Check if flake.lock has changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required top compare with previous commit
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            deps:
              - 'flake.lock'
              - '.github/workflows/build.yaml'

  build:
    needs: changes
    if: needs.changes.outputs.deps == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: Hephaistos, runner: ubuntu-26.04-arm }
          - { host: Hermes, runner: ubuntu-26.04-arm }
          - { host: Zephyr, runner: ubuntu-26.04 }
          - { host: Zeus, runner: ubuntu-26.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Free up space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: gasdev
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build ${{ matrix.host }}
        run: |
          nix build \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            --no-link --print-out-paths
