name: "Nix on droid"

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: gasdev
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: |
          nix build --impure --no-link --print-build-logs \
            --option extra-substituters https://nix-on-droid.cachix.org \
            --option extra-trusted-public-keys "nix-on-droid.cachix.org-1:56snoMJTXmDRC1Ei24CmKoUqvHJ9XCp+nidK7qkMQrU=" \
            .#nixOnDroidConfigurations.default.activationPackage
