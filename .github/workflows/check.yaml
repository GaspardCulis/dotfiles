name: "Build"

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: gasdev
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix flake check --show-trace
