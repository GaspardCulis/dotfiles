name: "Flake check"

on:
  push:
    branches:
      - main

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Adapte le runner à l'architecture réelle de chaque hôte
          - { system: x86_64-linux, runner: ubuntu-26.04 }
          - { system: aarch64-linux, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: gasdev
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix flake check --system ${{ matrix.system }} --show-trace
